<text x="300" y="353" font-family="Arial, sans-serif" font-size="12" fill="#546c74" font-weight="400">0..1 center : 0..N reports</text>
<text x="758" y="329" font-family="Arial, sans-serif" font-size="12" fill="#00838f" font-weight="400">1 report : 0..N</text>
<text x="40" y="530" font-family="Arial, sans-serif" font-size="13" fill="#00838f" font-weight="400">1 report : 0..N per child table</text>
<text x="35" y="716" font-family="Arial, sans-serif" font-size="14" fill="#546c74" font-weight="400">PK = primary key; FK = foreign key; UQ = unique. Every report belongs to one incident, one casualty, and one encoder.</text>
<text x="35" y="742" font-family="Arial, sans-serif" font-size="13" fill="#546c74" font-weight="400">Relationship view is selective. Full field declarations and all source tables are in the searchable schema catalog.</text>
